version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: medax_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medax_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongDatabasePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-medax_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medax_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medax_user}:${POSTGRES_PASSWORD:-StrongDatabasePass2026!}@db:5432/${POSTGRES_DB:-medax_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medax.uz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      SMS_PROVIDER: ${SMS_PROVIDER:-eskiz}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-false}
      TRUST_PROXY: "1"
      DAILY_SMS_BUDGET: ${DAILY_SMS_BUDGET:-250}
      DAILY_IP_SMS_LIMIT: ${DAILY_IP_SMS_LIMIT:-8}
      HOURLY_PHONE_OTP_LIMIT: ${HOURLY_PHONE_OTP_LIMIT:-4}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      INPAY_MERCHANT_ID: ${INPAY_MERCHANT_ID:-63710}
      INPAY_MERCHANT_TOKEN: ${INPAY_MERCHANT_TOKEN:-}
      INPAY_BASE_URL: ${INPAY_BASE_URL:-https://inpay.uz/api/v1}
      INPAY_CALLBACK_URL: ${INPAY_CALLBACK_URL:-https://medax.uz/api/orders/inpay/callback}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MedaxAuthbot}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medax_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - uploads_data:/app/uploads:ro

volumes:
  pgdata:
  uploads_data:
