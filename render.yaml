databases:
  - name: medax-db
    databaseName: medax_db
    user: medax_user
    plan: free

services:
  - type: web
    name: medax-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: medax-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://medax.uz,https://www.medax.uz,https://medtex-xi.vercel.app"
      - key: ADMIN_EMAIL
        value: "admin@medax.uz"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: "eskiz"
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: ESKIZ_FROM
        value: "4546"
      - key: INPAY_MERCHANT_ID
        sync: false
      - key: INPAY_MERCHANT_TOKEN
        sync: false
      - key: INPAY_CALLBACK_URL
        value: "https://medax.uz/api/orders/inpay/callback"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "MedaxAuthbot"

